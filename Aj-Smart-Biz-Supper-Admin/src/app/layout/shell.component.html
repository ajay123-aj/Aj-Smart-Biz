<div class="shell" [class.nav-open]="navOpen()">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">AJ</span>
      <span class="brand-text">
        <strong>Aj Smart Biz</strong>
        <small>Super Admin</small>
      </span>
    </div>

    <nav class="nav">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <span class="nav-group-label">{{ group.label }}</span>
          @for (item of group.items; track item.route) {
            <a
              class="nav-item"
              [routerLink]="item.route"
              routerLinkActive="active"
              (click)="navOpen.set(false)"
            >
              <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
              {{ item.label }}
            </a>
          }
        </div>
      }
    </nav>

    <div class="sidebar-foot tiny muted">v1.0.0 · Aj Smart Biz</div>
  </aside>

  <div class="backdrop" (click)="navOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="btn btn-icon btn-ghost menu-btn" (click)="navOpen.set(!navOpen())" aria-label="Toggle navigation">☰</button>

      <div class="grow"></div>

      <button
        type="button"
        class="btn btn-icon btn-ghost"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        {{ themeService.theme() === 'dark' ? '☀️' : '🌙' }}
      </button>

      <div class="profile">
        <button type="button" class="profile-btn" (click)="menuOpen.set(!menuOpen())">
          <span class="avatar">{{ userInitials() }}</span>
          <span class="profile-text">
            <strong>{{ auth.user()?.name }}</strong>
            <small>{{ auth.user()?.isRoot ? 'Root super admin' : 'Super admin' }}</small>
          </span>
          <span aria-hidden="true">▾</span>
        </button>

        @if (menuOpen()) {
          <div class="menu" (click)="menuOpen.set(false)">
            <a class="menu-item" routerLink="/profile">👤 My profile</a>
            <button type="button" class="menu-item danger" (click)="auth.logout()">🚪 Sign out</button>
          </div>
        }
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
