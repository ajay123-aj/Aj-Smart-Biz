# ------------------------------------------------------------------ #
# Shared snippet: the WebSocket upgrade map.
#
# Deployed to /etc/nginx/conf.d/managed-00-upgrade-map.conf. It is not a
# domain - it defines one variable that the domain files below it use - and it
# is named `00-` so it is obvious at a glance in a directory listing that it
# comes first and is not a site.
#
# ------------------------- why this file exists ------------------------- #
#
# The usual copy-paste proxy block does this:
#
#     proxy_set_header Upgrade    $http_upgrade;
#     proxy_set_header Connection "upgrade";
#
# The second line is wrong for every request that is not a WebSocket
# handshake, which is almost all of them. It tells the upstream "close this
# connection after the response", so nginx cannot keep the upstream connection
# alive and opens a fresh TCP connection per request. On a busy Node or Next.js
# process that shows up as avoidable latency and a pile of TIME_WAIT sockets.
#
# The map makes `Connection` follow the request instead of being hard-coded:
#
#     a real WebSocket handshake  ->  Connection: upgrade
#     an ordinary HTTP request    ->  Connection: ""  (keep-alive is preserved)
#
# `default upgrade;` rather than a literal, so a non-empty Upgrade header of
# any kind - h2c, or a protocol nginx has never heard of - is passed through
# rather than silently dropped.
#
# There must be exactly ONE of these on the server: nginx refuses to start with
# two maps defining the same variable, and `nginx -t` would catch that and roll
# the deploy back. Every domain file in this directory uses this one.
# ------------------------------------------------------------------ #

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
