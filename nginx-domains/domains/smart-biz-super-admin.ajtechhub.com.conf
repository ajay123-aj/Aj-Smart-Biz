# ------------------------------------------------------------------ #
# smart-biz-super-admin.ajtechhub.com - Aj Smart Biz Super Admin console.
#
# Angular, served by nginx inside its own container, on 127.0.0.1:4200.
# Source of truth for the port: deploy/aj-smart-biz-supper-admin/.env
#
# Deployed to
# /etc/nginx/conf.d/managed-smart-biz-super-admin.ajtechhub.com.conf.
#
# No TLS in this file - certbot writes the 443 block and the redirect. The
# reasoning is in smart-biz.ajtechhub.com.conf.
#
# Note the spelling: the service directory is `aj-smart-biz-supper-admin` (two
# p's, a typo that is now load-bearing in image tags and paths), but a public
# host name is forever and visible, so this one is spelled `super`. They are
# allowed to differ - nothing matches the directory name against the domain.
#
# No SPA fallback here: the inner container's nginx already does it. The
# reasoning is spelled out in smart-biz-admin.ajtechhub.com.conf.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz-super-admin.ajtechhub.com;

    location / {
        proxy_pass http://127.0.0.1:4200;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # See managed-00-upgrade-map.conf.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    client_max_body_size 4m;

    # This console administers every tenant on the platform. It is the highest
    # value host name here, so it is the one worth locking down first: put it
    # behind the office IP range, a VPN, or basic auth once you have one. The
    # `allow`/`deny` shape is left commented rather than guessed at, because a
    # wrong range here locks you out of your own platform.
    #
    # One caveat if you do: certbot clones this whole server block to port 443,
    # so the restriction is inherited there too - which is what you want - but
    # it must NOT block Let's Encrypt's own validation request. certbot's nginx
    # plugin validates by temporarily rewriting this block, so it works; a
    # webroot-style challenge location would have to stay open.
    #
    #   allow 203.0.113.0/24;   # office
    #   deny  all;

    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/smart-biz-super-admin.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz-super-admin.ajtechhub.com.error.log warn;
}
