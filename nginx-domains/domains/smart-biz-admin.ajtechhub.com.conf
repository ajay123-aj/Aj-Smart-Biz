# ------------------------------------------------------------------ #
# smart-biz-admin.ajtechhub.com - Aj Smart Biz Admin, the company console.
#
# Angular, served by nginx inside its own container, on 127.0.0.1:4300.
# Source of truth for the port: deploy/aj-smart-biz-admin/.env
#
# Deployed to /etc/nginx/conf.d/managed-smart-biz-admin.ajtechhub.com.conf.
#
# No TLS in this file - certbot writes the 443 block and the redirect. The
# reasoning is in smart-biz.ajtechhub.com.conf.
#
# Was `admin.ajtechhub.com` in the first draft; renamed so the whole platform
# sits under one prefix. A bare `admin.<anything>` is also the first host name
# every scanner on the internet tries.
#
# ----------------------- no SPA fallback here ----------------------- #
#
# An Angular reverse proxy usually needs `try_files $uri /index.html` so a deep
# link like /users/42 does not 404. This one does not, and adding it would be
# wrong: Aj-Smart-Biz-Admin/Dockerfile serves the build from nginx INSIDE the
# container, and that inner nginx already does the fallback
# (docker/nginx.conf.template). The host nginx here is a pure reverse proxy in
# front of it, so it must pass the path through untouched and let the inner
# server decide. A fallback at this layer would mean two servers both claiming
# to route the SPA, and the outer one would win with stale rules.
#
# If the console is ever served as a plain directory of files on this host
# instead of a container, this block is replaced by a `root` + `try_files`
# block - not augmented with one.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz-admin.ajtechhub.com;

    location / {
        proxy_pass http://127.0.0.1:4300;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # See managed-00-upgrade-map.conf.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # The console talks to smart-biz-api.ajtechhub.com directly from the
    # browser, so nothing large is posted to this origin. Uploads made through
    # the console go to the API host and are governed by its limit, not this.
    client_max_body_size 4m;

    # A private console has no reason to appear in a search index, and the
    # header costs nothing. `always` so it is set on error responses too.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/smart-biz-admin.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz-admin.ajtechhub.com.error.log warn;
}
