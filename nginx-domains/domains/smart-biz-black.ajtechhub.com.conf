# ------------------------------------------------------------------ #
# smart-biz-black.ajtechhub.com - the salon tenant theme (black).
#
# Next.js standalone server on 127.0.0.1:4500.
# Source of truth for the port: deploy/aj-smart-biz-black-theme/.env
# App: themes/salon/black-theme
#
# Deployed to /etc/nginx/conf.d/managed-smart-biz-black.ajtechhub.com.conf.
#
# No TLS in this file - certbot writes the 443 block and the redirect. The
# reasoning is in smart-biz.ajtechhub.com.conf.
#
# A live tenant on its own domain is added to `server_name` below rather than
# given a second file - that, and the `/uploads` caveat, are written out once
# in smart-biz-white.ajtechhub.com.conf.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz-black.ajtechhub.com;

    location / {
        proxy_pass http://127.0.0.1:4500;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # See managed-00-upgrade-map.conf.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    client_max_body_size 8m;

    access_log /var/log/nginx/smart-biz-black.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz-black.ajtechhub.com.error.log warn;
}
