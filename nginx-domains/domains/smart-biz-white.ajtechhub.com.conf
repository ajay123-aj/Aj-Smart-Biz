# ------------------------------------------------------------------ #
# smart-biz-white.ajtechhub.com - the informational tenant theme (white).
#
# Next.js standalone server on 127.0.0.1:4400.
# Source of truth for the port: deploy/aj-smart-biz-white-theme/.env
# App: themes/informational/white-theme
#
# Deployed to /etc/nginx/conf.d/managed-smart-biz-white.ajtechhub.com.conf.
#
# No TLS in this file - certbot writes the 443 block and the redirect. The
# reasoning is in smart-biz.ajtechhub.com.conf.
#
# ----------------------- what this host is for ----------------------- #
#
# The three theme hosts are the platform's own address for a tenant site -
# somewhere to preview a theme, hand a demo link to a prospect, and point a
# health check at. A live tenant is expected to arrive on its OWN domain.
#
# When that happens, do NOT create a second file. Add the customer's domain to
# `server_name` below, so both names reach the same upstream and there is one
# place to change if the port moves:
#
#     server_name smart-biz-white.ajtechhub.com www.acme.example acme.example;
#
# setup-ssl.sh reads that line, so the new name gets its own certificate on the
# next run with no other change. Point the customer's DNS at this server BEFORE
# pushing: a name that does not resolve here yet is skipped, and the domain
# then answers on plain HTTP until the next run picks it up.
#
# A tenant that should NOT be reachable at the platform address gets its own
# file instead.
#
# ---------------------------- uploads ---------------------------- #
#
# `/uploads` is NOT proxied here. The theme images bake a Next.js rewrite for
# it into the route manifest at build time from NEXT_PUBLIC_FILES_URL, so the
# request is already handled inside the app. Adding a `location /uploads` here
# would shadow that rewrite with a second, staler answer.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz-white.ajtechhub.com;

    location / {
        proxy_pass http://127.0.0.1:4400;

        proxy_http_version 1.1;

        # $host, not a literal: a tenant site reached on its own domain must
        # see that domain, or every absolute URL and canonical tag it renders
        # points at the wrong site.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # See managed-00-upgrade-map.conf.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Contact and enquiry forms only; anything larger belongs on the API host.
    client_max_body_size 8m;

    access_log /var/log/nginx/smart-biz-white.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz-white.ajtechhub.com.error.log warn;
}
