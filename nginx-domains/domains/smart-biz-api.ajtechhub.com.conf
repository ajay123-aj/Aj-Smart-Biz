# ------------------------------------------------------------------ #
# smart-biz-api.ajtechhub.com - Aj Smart Biz Backend, the NestJS API.
#
# NestJS on 127.0.0.1:4000. Swagger is at /api/v1/docs.
# Source of truth for the port: deploy/aj-smart-biz-backend/.env
#
# Deployed to /etc/nginx/conf.d/managed-smart-biz-api.ajtechhub.com.conf.
#
# No TLS in this file - certbot writes the 443 block and the redirect. The
# reasoning is in smart-biz.ajtechhub.com.conf.
#
# ------------------------- note on the name ------------------------- #
#
# This host was `aj-api.ajtechhub.com` in the first draft of this directory.
# It is `smart-biz-api` now so the whole platform sits under one prefix.
#
# Nothing in the repository referred to the old name - the consoles reach the
# API through the `aj-smart-biz-backend` container name, not through a public
# host - so the rename is free. If some external client HAS been given
# `aj-api.ajtechhub.com`, add it to `server_name` below rather than deleting
# it; setup-ssl.sh reads that line, so it gets its own certificate with no
# other change.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz-api.ajtechhub.com;

    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # NestJS needs this to build correct absolute URLs - including the
        # server list in the Swagger document, which otherwise tells every
        # reader to call the API over http://.
        proxy_set_header X-Forwarded-Proto $scheme;

        # See managed-00-upgrade-map.conf. An API that later adds a WebSocket
        # gateway works without touching this file.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # An API is the one place where retrying at the edge is dangerous: a
        # POST replayed on a second attempt can create the same row twice. Only
        # errors that prove the request never reached the app are retried.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    # File uploads go through this API, so the limit is the upload ceiling, not
    # a request-size guess. Raise it here and in the app's own body-size config
    # together - whichever is smaller is the one that actually applies, and a
    # mismatch produces a confusing 413 from the wrong layer.
    client_max_body_size 25m;

    # Uploaded files are streamed through rather than buffered to a temp file
    # first, which keeps a large upload off the disk and starts the app
    # processing it immediately.
    proxy_request_buffering off;

    access_log /var/log/nginx/smart-biz-api.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz-api.ajtechhub.com.error.log warn;
}
