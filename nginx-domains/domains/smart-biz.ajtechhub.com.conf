# ------------------------------------------------------------------ #
# smart-biz.ajtechhub.com - Aj Smart Biz Technology, the product website.
#
# Next.js standalone server on 127.0.0.1:4700.
# Source of truth for the port: deploy/aj-smart-biz-technology/.env
#
# Deployed to /etc/nginx/conf.d/managed-smart-biz.ajtechhub.com.conf.
#
# ----------------------- no TLS in this file ----------------------- #
#
# This file defines the domain and its proxy. Nothing else. There is no 443
# block, no ssl_certificate, no redirect - certbot writes all of that.
#
#     1. this file puts the domain on port 80, proxying to the app
#     2. setup-ssl.sh runs `certbot --nginx`, which reads this server block,
#        clones it into a 443 block with the certificate, and turns the port 80
#        block into a redirect
#
# So the deployed file on the server will not match this one after certbot has
# run, and that is expected rather than drift. Every deploy replaces the file
# from git - dropping certbot's additions - and setup-ssl.sh immediately puts
# them back, which is why it runs on every deploy and not only the first.
#
# The practical rule that follows: do not hand-write TLS here, and do not
# reverse-engineer what certbot added back into this file. Change the proxy;
# let certbot own the certificate half.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz.ajtechhub.com;

    # Next.js serves its own build assets under /_next/static with immutable,
    # content-hashed names, so nothing here needs a separate static root.
    location / {
        proxy_pass http://127.0.0.1:4700;

        # 1.0 is the default for proxied requests and cannot do keep-alive or
        # a protocol upgrade. Every proxy block on this server sets 1.1.
        proxy_http_version 1.1;

        # $host is the name the browser asked for, which is what Next.js needs
        # to build absolute URLs. $proxy_host would hand it "127.0.0.1:4700".
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # $scheme, not a literal "http": certbot clones this block to port 443,
        # and there the same line correctly reports https. Hard-coding it would
        # make the app build http:// URLs on the TLS site and the browser would
        # block them as mixed content.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # See managed-00-upgrade-map.conf: `upgrade` for a real WebSocket
        # handshake, empty otherwise, which keeps upstream keep-alive working
        # for the ordinary page loads that are 99% of the traffic.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Without this, a request that arrives while the container is
        # restarting gets a 502. With it, nginx retries the next attempt.
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # The demo form composes a WhatsApp or mail link in the visitor's browser;
    # nothing is uploaded. A small limit here means a malformed or hostile
    # request is rejected by nginx instead of occupying a Node process.
    client_max_body_size 2m;

    access_log /var/log/nginx/smart-biz.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz.ajtechhub.com.error.log warn;
}
