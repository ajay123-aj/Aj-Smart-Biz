# ------------------------------------------------------------------ #
# smart-biz-decor-framing.ajtechhub.com - the decor and framing tenant theme
# (Gilt), the commercial theme.
#
# Next.js standalone server on 127.0.0.1:4600.
# Source of truth for the port: deploy/aj-smart-biz-decor-framing/.env
# App: themes/commercial/decor-framing
#
# Deployed to
# /etc/nginx/conf.d/managed-smart-biz-decor-framing.ajtechhub.com.conf.
#
# No TLS in this file - certbot writes the 443 block and the redirect. The
# reasoning is in smart-biz.ajtechhub.com.conf.
#
# A live tenant on its own domain is added to `server_name` below rather than
# given a second file - that, and the `/uploads` caveat, are written out once
# in smart-biz-white.ajtechhub.com.conf.
# ------------------------------------------------------------------ #

server {
    listen 80;
    listen [::]:80;

    server_name smart-biz-decor-framing.ajtechhub.com;

    location / {
        proxy_pass http://127.0.0.1:4600;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # See managed-00-upgrade-map.conf.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # A shop theme: product enquiry forms rather than uploads, so the same
    # limit as the other themes.
    client_max_body_size 8m;

    access_log /var/log/nginx/smart-biz-decor-framing.ajtechhub.com.access.log;
    error_log  /var/log/nginx/smart-biz-decor-framing.ajtechhub.com.error.log warn;
}
