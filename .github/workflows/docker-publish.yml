# ------------------------------------------------------------------ #
# Build the API image and push it to Docker Hub.
#
# Runs on every push to `dev_live`, and on demand from the Actions tab.
#
# Two repository secrets are required — Settings → Secrets and variables →
# Actions:
#
#   DOCKERHUB_USERNAME   the Docker Hub account the image is pushed as
#   DOCKERHUB_TOKEN      an access token from Docker Hub → Account settings →
#                        Personal access tokens, with Read & Write scope.
#                        An account password works and should not be used: a
#                        token can be revoked on its own.
#
# The image name below is fixed rather than read from the username secret, so
# the tag a deployment pulls does not change if the pushing account ever does.
# ------------------------------------------------------------------ #

name: Docker image

on:
  push:
    branches: [dev_live]
    # Only when something that ends up *in* the image changes. A commit that
    # touches the Angular consoles or the websites rebuilds nothing, which is
    # the difference between a queue that is worth watching and one nobody
    # looks at.
    paths:
      - 'Aj-Smart-Biz-Backend/**'
      - '.github/workflows/docker-publish.yml'
  # So the image can be rebuilt without an empty commit — a rotated base image
  # or a re-run after fixing a secret.
  workflow_dispatch:

# A second push while the first is still building makes the first one's image
# pointless: both would push the same moving `dev_live` tag, and the older run
# could land last. Newest wins, the older run is cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: aj-smart-biz-backend
    runs-on: ubuntu-latest

    # The job reads the repository and writes to Docker Hub. It has no reason
    # to be able to write back to GitHub, so it is not given the chance.
    permissions:
      contents: read

    env:
      IMAGE: ajay123-aj/aj-smart-biz-backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Buildx is what makes the registry cache and the layer cache below
      # available at all; the default docker driver supports neither.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Last step before the push that could fail for a boring reason, so it is
      # deliberately early: a missing or expired token fails here in seconds
      # rather than after a full build.
      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two tags on purpose:
      #
      #   dev_live      the moving tag a dev environment pulls
      #   dev_live-sha  the exact commit, so a bad deploy can be rolled back to
      #                 the one before it rather than to "whatever dev_live was
      #                 yesterday"
      #
      # No `latest`. This branch is not the release branch, and a `latest` tag
      # pointing at dev builds is how a staging image ends up in production.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev_live-,format=short
          labels: |
            org.opencontainers.image.title=Aj Smart Biz API
            org.opencontainers.image.description=Multi-tenant SaaS backend (Express + Sequelize)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The backend directory, not the repository root: the Dockerfile and
          # its .dockerignore live there, and a root context would ship three
          # Angular apps and four Next.js sites into the build.
          context: ./Aj-Smart-Biz-Backend
          file: ./Aj-Smart-Biz-Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Restores the `npm ci` layer between runs, so a commit that only
          # touches `src/` does not reinstall the dependency tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what was pushed
        run: |
          echo "### Pushed to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
