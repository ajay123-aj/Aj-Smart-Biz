# ------------------------------------------------------------------ #
# nginx domains deploy - publish nginx-domains/ to this Ubuntu host, reload
# nginx, and get a certificate for every domain.
#
# Runs on every push to `nginx-domain-live`, which includes the merge commit a
# pull request into that branch produces, and on demand from the Actions tab.
#
# ------------------------- where this runs ------------------------- #
#
# On the SELF-HOSTED runner, which is the server itself - the same runner every
# other deploy on this platform uses. Not on a GitHub-hosted runner.
#
# That is what makes the whole thing work on a server with no inbound public
# access. The runner polls GitHub outbound and does the work locally, so there
# is no SSH, no deploy key, no host-key pinning, and no need for anything to be
# reachable from the internet in order to DEPLOY.
#
# It also means these secrets are NOT used and can be deleted if nothing else
# wants them:
#
#     NGINX_SERVER_HOST   NGINX_SERVER_USER
#     NGINX_SERVER_SSH_KEY   NGINX_SERVER_PORT   NGINX_SERVER_KNOWN_HOSTS
#
# ------------------------------ secrets ------------------------------ #
#
# Settings -> Secrets and variables -> Actions -> Secrets:
#
#   CLOUDFLARE_API_TOKEN   a SCOPED token - Zone | DNS | Edit, restricted to
#                          the one zone. NOT the Global API Key, which cannot
#                          be scoped and can do anything to the account. See
#                          "the token" in nginx-domains/setup-cloudflare-dns.sh
#   CLOUDFLARE_ZONE_ID     optional; looked up from the zone name if absent
#
# That is the only secret this workflow needs.
#
# Variables (same page, Variables tab) - all optional:
#
#   NGINX_SERVER_IP     the public IPv4 the A records point at. Leave it unset
#                       and the runner asks the internet what this host's
#                       public address is, which is the right answer more often
#                       than a value typed by hand - see "the public address"
#   CLOUDFLARE_ZONE     the zone to manage. Defaults to `ajtechhub.com`
#   NGINX_AUTO_DNS      `false` skips the Cloudflare step entirely
#   NGINX_AUTO_SSL      `false` skips certificate issuance
#   NGINX_SYNC_SCRIPT   `false` stops this job updating the two scripts on the
#                       server, so they are changed only by hand as root. See
#                       the comment on the install step
#   NGINX_DOMAINS_ROOT  where the system lives. Defaults to /opt/nginx-domains
#
# -------------------------- the public address -------------------------- #
#
# Deploying needs no inbound access. Being REACHED does, and so does getting a
# certificate: Let's Encrypt validates a domain by resolving it and connecting
# to it on port 80 from the outside.
#
# So the A record has to point at whatever address the internet uses to reach
# this host - the router, the NAT gateway, the elastic IP - which is not the
# address the host sees on its own NIC. `ip addr` and `hostname -I` report the
# private one; this job asks an outside service instead, from the server, which
# is the only place that gets the right answer.
#
# If nothing forwards port 80 to this host, DNS is still created and the
# certificate step reports each domain as unreachable and skips it. The sites
# come up on plain HTTP and nothing is broken - there is simply no certificate
# until inbound 80 exists.
#
# ---------------------- what the runner user needs ---------------------- #
#
# One sudoers rule, and write access to the deploy directory:
#
#     sudo chown -R "$(whoami):$(whoami)" /opt/nginx-domains
#     sudo visudo -f /etc/sudoers.d/nginx-domains     # see README.md section 3
#
# The sudo rule covers exactly two commands - the deploy script and the ssl
# script - and nothing else.
# ------------------------------------------------------------------ #

name: nginx domains deploy

on:
  push:
    branches: [nginx-domain-live]
  # So configuration can be re-applied without an empty commit - after a
  # server rebuild, or a re-run once a secret is fixed.
  workflow_dispatch:

jobs:
  deploy:
    name: deploy nginx domains
    # The labels of the self-hosted runner, matching every other deploy in this
    # repository. `runs-on` matches labels, never the runner's name.
    runs-on: [self-hosted, Linux, X64]

    # Deliberately NOT cancel-in-progress. A cancelled run could be killed
    # between writing /etc/nginx/conf.d and reloading, and the script's rollback
    # would be racing the next run's backup. Two pushes in a minute queue
    # instead, and the second simply re-applies the newer files.
    concurrency:
      group: nginx-domains-${{ github.ref }}
      cancel-in-progress: false

    # Reads the repository, talks to Cloudflare, and writes to this host. It has
    # no reason to write back to GitHub, so it is not given the chance.
    permissions:
      contents: read

    env:
      SRC: nginx-domains
      ROOT: ${{ vars.NGINX_DOMAINS_ROOT || '/opt/nginx-domains' }}
      AUTO_SSL: ${{ vars.NGINX_AUTO_SSL || 'true' }}
      MANAGE_DNS: ${{ vars.NGINX_AUTO_DNS || 'true' }}
      SYNC_SCRIPT: ${{ vars.NGINX_SYNC_SCRIPT || 'true' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # A cheap read of the files before anything is touched. This is NOT a
      # substitute for `nginx -t` - half of what nginx validates depends on the
      # rest of the server's configuration tree - but it catches the mistakes
      # that are obvious from the text alone, so an unbalanced brace fails in
      # five seconds instead of after a backup and a rollback.
      - name: Sanity-check the configuration files
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ ! -d "$SRC/domains" ]; then
            echo "::error::$SRC/domains does not exist in this repository."
            exit 1
          fi

          files=("$SRC"/domains/*.conf)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::$SRC/domains contains no *.conf files. Refusing to deploy an"
            echo "::error::empty directory, which would remove every managed domain."
            echo "::error::If that is genuinely what you want, run the script on the"
            echo "::error::server by hand with --allow-empty."
            exit 1
          fi

          bad=0
          for f in "${files[@]}"; do
            base="$(basename "$f")"

            if [ ! -s "$f" ]; then
              echo "::error file=$f::$base is empty."
              bad=1
            fi

            if [[ ! "$base" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.conf$ ]]; then
              echo "::error file=$f::$base has an unsafe filename. Use letters, digits, dot, dash, underscore."
              bad=1
            fi

            if [[ "$base" == managed-* ]]; then
              echo "::error file=$f::$base must not start with 'managed-'. The deploy script adds that prefix."
              bad=1
            fi

            # Brace balance, ignoring comments and the braces inside quoted
            # strings that a `map` block is full of. Crude, and crude is the
            # point: it only ever fires on a file that is definitely wrong.
            stripped="$(sed -e 's/#.*$//' -e "s/'[^']*'//g" -e 's/"[^"]*"//g' "$f")"
            open=$(printf '%s' "$stripped" | tr -cd '{' | wc -c)
            close=$(printf '%s' "$stripped" | tr -cd '}' | wc -c)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::$base has unbalanced braces ($open '{' vs $close '}')."
              bad=1
            fi
          done

          [ "$bad" -eq 0 ] || exit 1
          echo "${#files[@]} configuration file(s) look structurally sound."

      # Asked from the server, because the server is the only place that can be
      # asked. A value in NGINX_SERVER_IP wins, for a host whose public address
      # is not discoverable this way - behind an outbound proxy, or where the
      # inbound address deliberately differs from the outbound one.
      - name: Work out the public address
        if: env.MANAGE_DNS == 'true'
        id: ip
        env:
          CONFIGURED_IP: ${{ vars.NGINX_SERVER_IP || secrets.NGINX_SERVER_IP }}
        run: |
          set -euo pipefail

          # A usable A record target: an IPv4 address that is routable on the
          # public internet. Everything rejected here would be accepted by
          # Cloudflare and then be unreachable from outside, which is a far
          # more confusing failure than this one.
          is_public_ipv4() {
            local ip="$1"
            [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { block="not an IPv4 address"; return 1; }
            case "$ip" in
              10.*)                                  block="10.0.0.0/8 (RFC1918 private)" ;;
              192.168.*)                             block="192.168.0.0/16 (RFC1918 private)" ;;
              172.1[6-9].*|172.2[0-9].*|172.3[01].*) block="172.16.0.0/12 (RFC1918 private)" ;;
              127.*)                                 block="127.0.0.0/8 (loopback)" ;;
              169.254.*)                             block="169.254.0.0/16 (link-local)" ;;
              100.6[4-9].*|100.[7-9][0-9].*|100.1[0-1][0-9].*|100.12[0-7].*)
                                                     block="100.64.0.0/10 (carrier-grade NAT)" ;;
              0.*)                                   block="0.0.0.0/8 (unusable)" ;;
              *)                                     block=""; return 0 ;;
            esac
            return 1
          }

          # A configured value wins, but only if it could actually work. A
          # private address here is always a mistake - usually the output of
          # `ip addr` or `hostname -I`, which report the NIC rather than the
          # address the internet uses - and failing the deploy over a stale
          # value when the right one can simply be measured helps nobody.
          #
          # So it warns and falls through to detection rather than exiting. The
          # warning names the block rather than the address, because a value set
          # as a SECRET is masked to *** in this log and an error about a value
          # you cannot see is not much of an error.
          if [ -n "${CONFIGURED_IP:-}" ]; then
            if is_public_ipv4 "$CONFIGURED_IP"; then
              echo "value=$CONFIGURED_IP" >> "$GITHUB_OUTPUT"
              echo "Using the configured NGINX_SERVER_IP."
              exit 0
            fi
            echo "::warning::NGINX_SERVER_IP is $block, which cannot be reached from the"
            echo "::warning::internet. Ignoring it and measuring this host's public address"
            echo "::warning::instead. Delete the NGINX_SERVER_IP secret/variable to silence"
            echo "::warning::this - auto-detection is the better answer on this runner,"
            echo "::warning::because it runs on the server itself."
          fi

          # Two services, because one being down should not stop a deploy. Both
          # return a bare address and nothing else. `-4` forces IPv4: an A
          # record needs one, and a dual-stacked host would otherwise sometimes
          # answer with its IPv6 address.
          for url in https://ifconfig.me https://api.ipify.org; do
            ip="$(curl -4 -sS --max-time 10 "$url" 2>/dev/null | tr -d '[:space:]' || true)"
            # A real regex rather than a glob. `[0-9]*.[0-9]*` would happily
            # accept "1x.2x.3x.4x", and a captive portal or an error page is
            # exactly the sort of thing that returns not-an-address here.
            if [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              echo "value=$ip" >> "$GITHUB_OUTPUT"
              echo "This host's public address, according to $url, is $ip."
              exit 0
            fi
            [ -n "$ip" ] && echo "$url returned something that is not an IPv4 address; trying the next one."
          done

          echo "::error::Could not work out this host's public IPv4 address."
          echo "::error::Both ifconfig.me and api.ipify.org failed - the runner may have"
          echo "::error::no outbound internet access, which would also stop it reaching"
          echo "::error::Cloudflare."
          echo "::error::Set the repository variable NGINX_SERVER_IP to the address the"
          echo "::error::internet uses to reach this host, or set NGINX_AUTO_DNS to false"
          echo "::error::to manage DNS by hand."
          exit 1

      # Before the deploy, because a domain cannot get a certificate until it
      # resolves. Idempotent: a record already pointing here is reported and
      # left alone, one pointing elsewhere is corrected, and a name outside the
      # managed zone - a tenant's own domain - is skipped. It never deletes.
      - name: Create the Cloudflare DNS records
        if: env.MANAGE_DNS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE: ${{ vars.CLOUDFLARE_ZONE || 'ajtechhub.com' }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SERVER_IP: ${{ steps.ip.outputs.value }}
          DOMAINS_DIR: nginx-domains/domains
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is not set. Create a scoped token"
            echo "::error::(Zone | DNS | Edit, restricted to $CLOUDFLARE_ZONE) under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            echo "::error::Set NGINX_AUTO_DNS to false to manage DNS by hand instead."
            exit 1
          fi

          # jq is not on a stock Ubuntu server the way curl is, and this is the
          # only step that needs it.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is not installed on this runner. Install it once:"
            echo "::error::  sudo apt-get update && sudo apt-get install -y jq"
            exit 1
          fi

          chmod +x nginx-domains/setup-cloudflare-dns.sh
          ./nginx-domains/setup-cloudflare-dns.sh

      # A plain copy now that the runner is on the server. The directory is
      # replaced rather than copied over the top: copying into the existing one
      # would leave behind a .conf deleted from git, and the deploy script would
      # keep publishing a domain no commit describes. Swapping the directory is
      # what makes "delete the file, push, the domain goes away" true.
      #
      # Two renames inside one filesystem, so the window in which domains/ does
      # not exist is microseconds, and the deploy has not started yet.
      - name: Install into the deploy directory
        run: |
          set -euo pipefail

          # Both of these are the one-time server setup not having been done.
          # install-server.sh does all of it - packages, directories, ownership
          # and the sudoers rule - and is safe to run more than once.
          if [ ! -d "$ROOT" ] || [ ! -w "$ROOT" ]; then
            if [ ! -d "$ROOT" ]; then
              echo "::error::$ROOT does not exist."
            else
              echo "::error::$(id -un) cannot write to $ROOT."
            fi
            echo "::error::"
            echo "::error::Run the one-time server setup, ON THIS SERVER, as root:"
            echo "::error::"
            echo "::error::    sudo $GITHUB_WORKSPACE/nginx-domains/install-server.sh"
            echo "::error::"
            echo "::error::It installs nginx, certbot, the certbot nginx plugin and jq,"
            echo "::error::creates $ROOT owned by $(id -un), and writes the sudoers rule"
            echo "::error::this job needs. Safe to run again. See README.md section 2."
            exit 1
          fi

          rm -rf "$ROOT/domains.new" "$ROOT/domains.old"
          cp -a "$SRC/domains" "$ROOT/domains.new"
          chmod 755 "$ROOT/domains.new"
          find "$ROOT/domains.new" -type f -name '*.conf' -exec chmod 644 {} +

          if [ -d "$ROOT/domains" ]; then
            mv "$ROOT/domains" "$ROOT/domains.old"
          fi
          mv "$ROOT/domains.new" "$ROOT/domains"
          rm -rf "$ROOT/domains.old"

          # The scripts run as root through sudo, so whoever can change them can
          # run anything as root. By default the repository is the source of
          # truth for them, which means anyone who can push to this branch has
          # root here - guarded by branch protection rather than by sudo.
          #
          # NGINX_SYNC_SCRIPT=false is the other trade: the scripts stay
          # root-owned and unwritable by the runner user, sudo genuinely limits
          # the blast radius, and updating them becomes a manual root action.
          # README.md section 3 has the digest-pinned sudoers form that makes
          # that guarantee enforceable.
          if [ "$SYNC_SCRIPT" = "true" ]; then
            install -m 0750 "$SRC/deploy-nginx-domains.sh" "$ROOT/deploy-nginx-domains.sh"
            install -m 0750 "$SRC/setup-ssl.sh"            "$ROOT/setup-ssl.sh"
            echo "scripts updated from the repository."
          else
            echo "NGINX_SYNC_SCRIPT=false - leaving the installed scripts alone."
            for f in deploy-nginx-domains.sh setup-ssl.sh; do
              if [ ! -x "$ROOT/$f" ]; then
                echo "::error::$ROOT/$f is missing or not executable, and"
                echo "::error::NGINX_SYNC_SCRIPT=false stops this job installing it."
                echo "::error::Install it once by hand:"
                echo "::error::  sudo install -o root -g root -m 0755 $SRC/$f $ROOT/$f"
                exit 1
              fi
            done
          fi

          echo "installed:"
          ls -l "$ROOT/domains"

      # Runs as the runner user, not root, and changes nothing. Its only job is
      # to put the plan - what will be deployed, what will be removed, how many
      # unmanaged files are being left alone - into the log BEFORE the change,
      # so a surprising removal is visible above the thing that did it.
      - name: Preview what will change
        run: "'${{ env.ROOT }}/deploy-nginx-domains.sh' --dry-run"

      # `sudo -n` never prompts: a missing or misspelled sudoers rule fails
      # immediately with "a password is required" rather than hanging until the
      # job times out.
      #
      # A non-zero exit - a failed `nginx -t`, a failed reload, a rollback -
      # fails the job with no extra plumbing.
      - name: Deploy and reload nginx
        run: sudo -n "$ROOT/deploy-nginx-domains.sh"

      # The .conf files in git describe a domain on port 80 and its proxy, and
      # nothing else; certbot owns the TLS half and writes the 443 block into
      # the deployed file.
      #
      # Which is why this runs on EVERY push rather than once: the deploy above
      # replaced the deployed file with the one from git, stripping the 443
      # block certbot added last time. This puts it back. See README.md
      # section 10.
      #
      # Cheap to repeat - `--keep-until-expiring` means a certificate with more
      # than 30 days left is kept and Let's Encrypt is not contacted. A domain
      # that is not reachable from outside is detected and skipped with a
      # ::warning::, and the job stays green: that is a port-forward or a DNS
      # record you have not created, not a broken deploy.
      - name: Issue or renew certificates
        if: env.AUTO_SSL == 'true'
        run: sudo -n "$ROOT/setup-ssl.sh"

      - name: Say what is live
        if: success()
        run: |
          set -euo pipefail
          {
            echo "### nginx domains deployed"
            echo ''
            echo "Commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
            echo ''
            echo '```'
            for f in /etc/nginx/conf.d/managed-*.conf; do
              [ -e "$f" ] || continue
              tls=$(grep -c '^[[:space:]]*listen 443' "$f" || true)
              printf '%-52s %s\n' "$(basename "$f")" \
                "$([ "$tls" -gt 0 ] && echo 'https' || echo 'http only')"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
